name: 部署网页版到 GitHub Pages

# 什么时候触发
on:
  push:
    branches: [main]
    # 只有网页版的文件变了才重新部署。改 Python 代码不会白白跑一次。
    paths:
      - "web/public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # 也可以在 Actions 页面上手动点一下触发

# GitHub Pages 官方要求的三个权限，少一个都会部署失败
permissions:
  contents: read # 读代码
  pages: write # 写 Pages
  id-token: write # 让 GitHub 能验证这次部署确实来自本仓库

# 同一时间只跑一个部署。连着推两次代码时，把前一次取消掉，
# 免得两个部署抢着发布同一份文件。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 web/public 目录
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布这一个目录。Python 版、测试、文档都不该出现在网站上。
          path: web/public

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
